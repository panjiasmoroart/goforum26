version: "3"
services:
  db:
    image: mysql:latest
    container_name: local-mysql-fast-campus
    ports:
      # kiri (3307) agar tidak bentrok dengan mysql Windows, kanan (3306) internal Docker
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=superSecretPassword
      - MYSQL_DATABASE=goforum_db
    volumes:
      - /FastCampusDb/mysql_db/db:/var/lib/mysql
